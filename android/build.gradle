// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// D211: npm ci restores the upstream source. Always verify/repair it BEFORE
// JavaCompile; unknown versions or source hashes fail the manual APK build.
def repairTts = tasks.register('repairParchLockTtsCancellation', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'tools/patch-android-tts.cjs'
    outputs.upToDateWhen { false }
}
gradle.projectsEvaluated {
    project(':capacitor-community-text-to-speech').tasks.withType(JavaCompile).configureEach {
        dependsOn repairTts
    }
}
